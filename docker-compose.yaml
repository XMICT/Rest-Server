services:
  db:
    image: postgres:18
    container_name: rest-server-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/18/docker
    ports:
      - "5433:5432"

volumes:
  postgres: